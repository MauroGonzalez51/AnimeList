preferSymlinkedExecutables: true
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
    - chokidar@4.0.3
    - semver@6.3.1

linkWorkspacePackages: true
injectWorkspacePackages: true

packages:
    - apps/**/*
    - packages/**/*
    - tools/**/*

allowBuilds:
    esbuild: true
    puppeteer: true
    unrs-resolver: true
    vue-demi: true
minimumReleaseAgeExclude:
    - '@lucide/vue@1.52.0'
