[package]
name = "animelist-studio"
version = "0.1.0"
description = "AnimeList Studio Engine"
authors = [ "MauroGonzalez51" ]
license = ""
repository = "https://github.com/MauroGonzalez51/AnimeList"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = [
    "staticlib",
    "cdylib",
    "rlib"
]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.0"
directories = "6.0.0"
toml = "1.1.6"
anyhow = "1.0.104"
serde-saphyr = "1.3.0"
