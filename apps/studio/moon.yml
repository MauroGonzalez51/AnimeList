project:
    title: studio
    description: interface to manage your list

layer: tool

language: typescript

toolchains:
    default: node

workspace:
    inheritedTasks:
        include:
            - pnpm
            - lint
            - nuxt
            - build

tasks:
    pnpm:
        args:
            - --filter
            - "@animelist/apps-studio"

    cargo:
        command: scripts/change-directory.sh
        args:
            - apps/studio/src-tauri
            - cargo
        options:
            cache: false
            runFromWorkspaceRoot: true

    tauri:
        extends: pnpm
        args:
            - exec
            - tauri
        env:
            # [INFO] Needed cuz having problems with nvidia drivers
            LIBGL_ALWAYS_SOFTWARE: "1"
            WEBKIT_DISABLE_COMPOSITING_MODE: "1"
            WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        options:
            cache: false

    shadcn:
        extends: pnpm
        args:
            - exec
            - shadcn-vue
        options:
            cache: false
