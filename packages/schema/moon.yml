project:
    name: Schema
    description: JSON Schema Generator based on Zod Schemas

layer: library

language: typescript

toolchains:
    default: node

workspace:
    inheritedTasks:
        include:
            - pnpm
            - lint

fileGroups:
    sources:
        - src/**/*
        - types/**/*.d.ts
        - package.json
        - tsdown.config.ts
        - tsconfig.json

tasks:
    pnpm:
        args:
            - --filter
            - "@animelist/schema"

    lint:
        inputs:
            - "@group(sources)"
        outputs:
            - "@group(sources)"

    build:
        command: pnpm
        args:
            - exec
            - tsdown
        inputs:
            - "@group(sources)"
        outputs: 
            - dist/**

    run:
        command: node
        args:
            - packages/schema/dist/cli.cjs
        deps:
            - schema:build
        options:
            cache: false
            interactive: true
            outputStyle: stream
            runFromWorkspaceRoot: true
